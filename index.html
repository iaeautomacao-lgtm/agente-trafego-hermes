<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tráfego Pago · Grupo DDM</title>
<meta name="description" content="Painel interno do Grupo DDM: campanhas, criativos, compliance, resultados e agentes do fluxo de tráfego pago.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --side:#0b0b0c; --panel:#111112; --panel-2:#17171a; --hover:#1c1c20;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --ink:#F3EDE4; --ink-2:#B9B3A8; --mute:#7C7770;
    --orange:#F26A1B; --amber:#E8A33D; --ok:#7BC47F; --red:#E5533D;
    --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,sans-serif;
    --sidew:224px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink-2)}

  /* layout */
  .app{display:grid;grid-template-columns:var(--sidew) 1fr;min-height:100vh}
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .brand .mark{width:22px;height:22px;background:var(--orange);clip-path:polygon(0 0,100% 0,100% 68%,68% 100%,0 100%)}
  .brand b{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:-.01em}
  .brand small{display:block;font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13.5px}
  .nav a:hover{background:var(--hover);color:var(--ink)}
  .nav a.on{background:var(--panel-2);color:var(--ink)}
  .nav a.on::before{background:var(--orange)}
  .nav a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
  .nav a .n{margin-left:auto;font-size:11.5px;color:var(--mute);background:rgba(255,255,255,.05);padding:1px 7px;border-radius:999px}
  .side .foot{margin-top:auto;padding:12px 8px 0;font-size:11.5px;color:var(--mute);line-height:1.6}
  .side .foot a{color:var(--ink-2)}
  .main{min-width:0;padding:0 28px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.01em}
  .top h1 span{color:var(--mute);font-weight:300}
  .top .r{display:flex;gap:10px;align-items:center}
  .search{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px;color:var(--ink);width:240px;font:13.5px var(--sans)}
  .search:focus{border-color:var(--orange);outline:0}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.warn{background:var(--amber)}.dot.off{background:var(--mute)}.dot.red{background:var(--red)}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--orange);color:#120700;border-radius:7px;font-weight:700;font-size:13px}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);font-weight:600}
  .btn.ghost:hover{color:var(--ink);border-color:var(--ink-2)}
  .btn.sm{padding:6px 10px;font-size:12.5px}

  /* cards / tiles */
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px}
  .tile b{display:block;font-family:var(--serif);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
  .tile b.o{color:var(--orange)}
  .tile span{display:block;font-size:12px;color:var(--mute);margin-top:7px}
  .tile em{display:block;font-style:normal;font-size:11.5px;margin-top:3px}
  .tile em.ok{color:var(--ok)}.tile em.amb{color:var(--amber)}.tile em.red{color:var(--red)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px}
  .card + .card{margin-top:18px}
  .card h2{margin:0;font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:-.01em}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .card .hd .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
  .two > .card{margin:0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  /* tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.03em;text-transform:uppercase;padding:0 12px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
  th.s{cursor:pointer;user-select:none}
  th.s:hover{color:var(--ink-2)}
  th.s.asc::after{content:" ↑"}th.s.desc::after{content:" ↓"}
  td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--hover)}
  td.m{color:var(--mute);white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.n{text-align:right}
  td .sub{display:block;color:var(--mute);font-size:12px}
  td.wide{min-width:220px}
  td.id{color:var(--mute);font-variant-numeric:tabular-nums;width:46px}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.06);white-space:nowrap}
  .tag.ok{color:var(--ok);background:rgba(123,196,127,.12)}.tag.amb{color:var(--amber);background:rgba(232,163,61,.12)}.tag.red{color:var(--red);background:rgba(229,83,61,.12)}.tag.o{color:var(--orange);background:rgba(242,106,27,.14)}
  .tag.Escalar{color:var(--ok)}.tag.Pausar{color:var(--red)}.tag.Reativar{color:var(--amber)}
  .bar{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
  .bar i{display:block;width:90px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;position:relative;overflow:hidden}
  .bar i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
  .bar b{font-weight:600;min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:34px 18px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:9px}
  .empty b{display:block;margin-bottom:4px;color:var(--ink)}
  .empty .btn{margin-top:12px}

  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .sel{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;font:13px var(--sans)}
  .sel:focus{border-color:var(--orange);outline:0}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
  .seg button{padding:6px 11px;font-size:12.5px;color:var(--ink-2)}
  .seg button.on{background:var(--panel-2);color:var(--ink)}

  /* detail */
  .crumb{font-size:12.5px;color:var(--mute);margin-bottom:6px}
  .crumb a{color:var(--ink-2)}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kv div{background:var(--panel-2);border-radius:8px;padding:12px 14px;font-size:13px}
  .kv b{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px}
  .tabs a{padding:8px 12px;color:var(--ink-2);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs a.on{color:var(--ink);border-color:var(--orange)}
  .steps{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .step{background:var(--panel-2);border-radius:8px;padding:10px 12px;border-left:2px solid var(--mute)}
  .step.on{border-left-color:var(--orange)}.step.gate{border-left-color:var(--ok)}.step.soon{border-left-color:transparent;opacity:.6}
  .step b{display:block;font-size:12.5px;font-weight:600}
  .step span{font-size:11.5px;color:var(--mute)}

  /* charts */
  .chart h3{margin:0 0 8px;font-size:13px;font-weight:600}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .read p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
  .read ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
  .read li{margin:3px 0}
  .read h3{margin:0 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
  .read .next{margin-top:12px;padding:11px 13px;border-left:2px solid var(--orange);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13.5px}

  /* agents */
  .agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .agent{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px}
  .agent .g{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--serif);font-size:16px;margin-bottom:10px}
  .agent h3{margin:0;font-size:14px;font-weight:600}
  .agent p{margin:4px 0 10px;font-size:12.5px;color:var(--mute)}
  .agent .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
  .agent .meta code{font-size:11.5px}

  /* form */
  label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
  input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 11px;font:13.5px/1.45 var(--sans)}
  input:focus,textarea:focus{border-color:var(--orange);outline:0}
  textarea{min-height:64px;resize:vertical}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .out{display:none;margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;color:var(--ink-2)}
  .out.show{display:block}

  /* editor */
  .ed{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  .ed textarea{min-height:560px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2;white-space:pre;overflow:auto}
  .ed .meta td{padding:8px 10px 8px 0;font-size:13px}
  .ed .meta td:first-child{color:var(--mute);white-space:nowrap;width:110px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:8px;padding:12px 16px;font-size:13px;max-width:420px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.err{border-left-color:var(--red)}
  .toast a{color:var(--orange)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40}
  .modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:20px 22px;width:min(420px,92vw)}
  .modal h2{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:18px}
  .modal p{margin:0 0 6px;font-size:12.5px;color:var(--mute)}
  .pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pstage{display:block;background:var(--panel-2);border-radius:8px;padding:12px 14px;border-left:2px solid var(--mute)}
  .pstage.amb{border-left-color:var(--amber)}.pstage.o{border-left-color:var(--orange)}.pstage.ok{border-left-color:var(--ok)}
  .pstage.zero{opacity:.55}
  .pstage b{display:block;font-family:var(--serif);font-weight:300;font-size:28px;line-height:1;letter-spacing:-.02em}
  .pstage span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
  .pstage:hover{background:var(--hover)}
  .agent.row{cursor:pointer}
  .agent.row:hover{border-color:var(--line-2);background:var(--panel-2)}
  .hide{display:none!important}
  @media (max-width:1100px){.ed{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,1fr)}.agents{grid-template-columns:1fr 1fr}}
  @media (max-width:760px){
    :root{--sidew:0px}
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:20;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none}
    .main{padding:0 16px 40px}
    .burger{display:inline-flex}
    .tiles{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.frow{grid-template-columns:1fr}.ed{grid-template-columns:1fr}.agents{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.pipeline{grid-template-columns:1fr 1fr}
    .search{width:140px}
    .bar i{width:50px}
    .hm{display:none}
  }
  .burger{display:none;width:34px;height:34px;border:1px solid var(--line-2);border-radius:7px;align-items:center;justify-content:center;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark"></span><div><b>Tráfego Pago</b><small>Grupo DDM · interno</small></div></div>
    <nav class="nav" id="nav">
      <a href="#/">Visão geral</a>
      <a href="#/campanhas">Campanhas<span class="n" data-n="camp"></span></a>
      <a href="#/criativos">Criativos<span class="n" data-n="cri"></span></a>
      <a href="#/resultados">Resultados</a>
      <a href="#/agentes">Agentes<span class="n" data-n="ag"></span></a>
      <a href="#/nova">Nova campanha</a>

    <div class="foot">Dados: <code>dados/campanhas.json</code><br>Atualizado <span id="upd">—</span><br><a href="https://github.com/iaeautomacao-lgtm/agente-trafego-hermes">Repositório</a> · <a href="http://127.0.0.1:3100/GRU/">Paperclip</a></div>
  </aside>
  <main class="main">

      <div style="display:flex;align-items:center;gap:12px"><button class="burger" id="burger" aria-label="Menu">≡</button><h1 id="title">Visão geral</h1></div>
      <div class="r" id="topr"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
/* ---------------- data ---------------- */
const BENCH_FALLBACK = { ctr_pct:[0.8,1.5], cpl_brl:[25,70], conversao_pct:[10,25], frequencia_max:3.0 };
const CAMPANHAS_FALLBACK = [
  { id:"demo-2", nome:"Matrícula trancada — agendar conversa", data:"6 out 2026", via:"Paperclip · 4 agentes", objetivo:"Ex-aluno com matrícula trancada agenda conversa com a instituição", publico:"22–40 anos, trancaram nos últimos 24 meses, RMSP", orcamento:"R$ 3.000", periodo:"14 dias", tempo:"18 min", score:18, veredito:"aprovado com ressalvas", status:"aprovada por Gui em 06/10, 14:03", arquivo:"exemplos/demo-matricula-trancada-paperclip.md",
    criativos:[{id:"1-A",conj:"Topo",hl:"Sua graduação ainda está disponível",fmt:"carrossel 3 frames",score:5,v:"aprovado"},{id:"1-B",conj:"Topo",hl:"Quem parou os estudos pode recomeçar",fmt:"vídeo 15 s",score:12,v:"com ressalvas"},{id:"2-A",conj:"Meio",hl:"Retomar é mais simples do que parece",fmt:"imagem única",score:5,v:"aprovado"},{id:"2-B",conj:"Meio",hl:"Entenda suas opções com uma conversa",fmt:"carrossel 2 frames",score:3,v:"aprovado"},{id:"3-A",conj:"Fundo",hl:"Preencha o formulário em 2 minutos",fmt:"imagem única",score:10,v:"com ressalvas"},{id:"3-B",conj:"Fundo",hl:"Viu suas opções. Hora de dar o passo?",fmt:"vídeo / cinemagraph",score:22,v:"com ressalvas"}], resultados:null },
  { id:"demo-1", nome:"Reengajamento — Faculdade Teste", data:"1 out 2026", via:"Terminal · Hermes", objetivo:"Aluno acessar o portal de negociação", publico:"Alunos inativos (lista), lookalike 1% e retargeting", orcamento:"R$ 2.000", periodo:"outubro", tempo:"4 min 33 s", score:20, veredito:"apta para publicação", status:"demo técnica, não publicada", arquivo:"exemplos/campanha-faculdade-teste-2026-10-01.md",
    criativos:[{id:"1-A",conj:"Quente",hl:"Retome seus estudos com a gente",fmt:"imagem única",sev:"risco médio",v:"com ressalvas"},{id:"1-B",conj:"Quente",hl:"Fale com a Faculdade Teste hoje",fmt:"imagem única",sev:"risco médio",v:"com ressalvas"},{id:"2-A",conj:"Morno",hl:"Sua carreira começa com um passo",fmt:"imagem única",sev:"risco baixo",v:"aprovado"},{id:"2-B",conj:"Morno",hl:"Graduação completa: seu futuro",fmt:"imagem única",sev:"risco baixo",v:"aprovado"},{id:"3-A",conj:"Retargeting",hl:"Sua próxima etapa começa aqui",fmt:"imagem única",sev:"risco médio",v:"com ressalvas"},{id:"3-B",conj:"Retargeting",hl:"Suas opções estão no portal",fmt:"imagem única",sev:"risco médio",v:"com ressalvas"}], resultados:null }
];
const AGENTES = [
  { k:"O", nome:"Orquestrador Hermes", papel:"Distribui as etapas, 2 tentativas, nunca publica", skill:"ddm-orquestrador-trafego", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"E", nome:"Estrategista de Tráfego 2", papel:"Briefing → plano em 7 seções", skill:"ddm-estrategista-trafego", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"C", nome:"Criativo de Anúncios 2", papel:"2 anúncios por conjunto", skill:"ddm-criativo-anuncios", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"D", nome:"Designer de Anúncios", papel:"Direção de arte + prompts feed/stories", skill:"ddm-designer-anuncios", st:"warn", stl:"sem gerador de imagem", runtime:"Paperclip · Hermes" },
  { k:"R", nome:"Compliance de Anúncios 2", papel:"Meta, LGPD, palavras proibidas, score 0–100", skill:"ddm-compliance-anuncios", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"P", nome:"Publicador Meta", papel:"Cria a campanha aprovada no Meta Ads, sempre em pausa", skill:"ddm-publicador-meta", st:"warn", stl:"sem acesso ao Meta", runtime:"Paperclip · Hermes" },
  { k:"A", nome:"Dados de Campanhas 2", papel:"Export do Meta Ads → painel + próximo ciclo", skill:"ddm-dados-campanhas", st:"ok", stl:"sem export ainda", runtime:"Paperclip · Hermes" },
];
const PENDENCIAS = [
  ["Acesso ao Meta Business Manager","Gustavo","warn"],
  ["Publicador Meta: script e skill prontos, falta token","META_ACCESS_TOKEN · Gustavo","warn"],
  ["Export da 1ª campanha para o agente Dados","depois da publicação","off"],
];
let CAMPANHAS = CAMPANHAS_FALLBACK, BENCH = BENCH_FALLBACK, SIM = null, META = {};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtBRL = n => n==null ? '—' : 'R$ ' + n.toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtN = n => n==null ? '—' : n.toLocaleString('pt-BR');
const fmtPct = n => n==null ? '—' : n.toLocaleString('pt-BR',{maximumFractionDigits:2}) + '%';
const fmt1 = n => n==null ? '—' : n.toLocaleString('pt-BR',{maximumFractionDigits:1});
const fmtDia = d => { const [y,m,dd] = d.split('-'); return `${+dd}/${+m}`; };
const ctrOf = x => x.impressoes ? x.cliques/x.impressoes*100 : null;
const cplOf = x => x.leads ? x.gasto/x.leads : null;
const frqOf = x => x.alcance ? x.impressoes/x.alcance : null;
const cnvOf = x => x.leads && x.conversoes!=null ? x.conversoes/x.leads*100 : null;
const vcls = v => v==="aprovado" ? "ok" : (v==="reprovado" ? "red" : "amb");
const scls = s => s<=20 ? "ok" : (s<=50 ? "amb" : "red");
const col = k => ({ok:'#7BC47F',amb:'#E8A33D',red:'#E5533D'}[k]);
function judge(k,v){
  if(v==null) return ['','sem dado'];
  if(k==='ctr') return [v<BENCH.ctr_pct[0]?'red':'ok', v<BENCH.ctr_pct[0]?'abaixo da faixa':(v>BENCH.ctr_pct[1]?'acima da faixa':'dentro da faixa')];
  if(k==='cpl') return [v>BENCH.cpl_brl[1]?'red':'ok', v>BENCH.cpl_brl[1]?'acima da faixa':(v<BENCH.cpl_brl[0]?'abaixo da faixa':'dentro da faixa')];
  if(k==='frq') return [v>BENCH.frequencia_max?'red':(v>BENCH.frequencia_max-0.5?'amb':'ok'), v>BENCH.frequencia_max?'desgaste':'saudável'];
  if(k==='cnv') return [v<BENCH.conversao_pct[0]?'red':'ok', v<BENCH.conversao_pct[0]?'abaixo da faixa':'dentro da faixa'];
  return ['',''];
}
const scoreCell = c => c.score==null ? `<span class="tag ${vcls(c.v)}">${esc(c.sev||'—')}</span>` : `<span class="bar"><i style="--w:${c.score}%;--c:${col(scls(c.score))}"></i><b>${c.score}</b></span>`;
const ETAPAS = [['montada','Montada','amb'],['aprovada','Aprovada','o'],['publicada','Publicada','ok'],['analisada','Analisada','ok']];
const etapaOf = c => c.etapa || (c.resultados ? 'analisada' : (/aprovad/i.test(c.status||'') ? 'aprovada' : 'montada'));
const campStatus = c => { const e=ETAPAS.find(x=>x[0]===etapaOf(c))||ETAPAS[0]; return [e[2], e[1]]; };
const allCreatives = () => CAMPANHAS.flatMap(c => c.criativos.map(x => ({...x, camp:c})));

/* ---------------- charts ---------------- */
function svgDaily(d){
  const W=640,H=200,L=44,R=36,T=12,B=28, iw=W-L-R, ih=H-T-B, n=d.length;
  const mg=Math.max(...d.map(x=>x.gasto||0))*1.15||1, ml=Math.max(...d.map(x=>x.leads||0))*1.15||1;
  const bw=Math.max(6, iw/n*0.56), x=i=>L+iw*(i+0.5)/n;
  const bars=d.map((r,i)=>`<rect x="${x(i)-bw/2}" y="${T+ih-(r.gasto/mg)*ih}" width="${bw}" height="${(r.gasto/mg)*ih}" rx="2" fill="rgba(242,106,27,.3)"/>`).join('');
  const pts=d.map((r,i)=>`${x(i)},${T+ih-(r.leads/ml)*ih}`).join(' ');
  const dots=d.map((r,i)=>`<circle cx="${x(i)}" cy="${T+ih-(r.leads/ml)*ih}" r="3" fill="#F3EDE4"/>`).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+ih-f*ih}" y2="${T+ih-f*ih}" stroke="rgba(255,255,255,.08)"/>`).join('');
  const yl=[0,.5,1].map(f=>`<text x="${L-8}" y="${T+ih-f*ih+4}" text-anchor="end" font-size="10.5" fill="#7C7770">${Math.round(f*mg/1.15)}</text>`).join('');
  const yr=[0,.5,1].map(f=>`<text x="${W-R+8}" y="${T+ih-f*ih+4}" font-size="10.5" fill="#7C7770">${Math.round(f*ml/1.15)}</text>`).join('');
  const step=Math.ceil(n/7);
  const xl=d.map((r,i)=> i%step===0||i===n-1 ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#7C7770">${fmtDia(r.dia)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto e leads por dia">${grid}${bars}<polyline points="${pts}" fill="none" stroke="#F3EDE4" stroke-width="1.6"/>${dots}${yl}${yr}${xl}</svg>
  <div class="legend"><span><i style="background:rgba(242,106,27,.5)"></i>gasto R$ (esq.)</span><span><i style="background:#F3EDE4"></i>leads (dir.)</span></div>`;
}
function svgCreatives(cr){
  const rows=cr.map(c=>({...c, cpl:cplOf(c), ctr:ctrOf(c)})).sort((a,b)=>(a.cpl??1e9)-(b.cpl??1e9));
  const W=460, rh=28, T=6, H=T+rows.length*rh+20, L=40, R=110, iw=W-L-R;
  const mx=Math.max(BENCH.cpl_brl[1]*1.2, ...rows.map(r=>r.cpl||0))*1.05, sx=v=>L+iw*v/mx;
  const band=`<rect x="${sx(BENCH.cpl_brl[0])}" y="${T-3}" width="${sx(BENCH.cpl_brl[1])-sx(BENCH.cpl_brl[0])}" height="${rows.length*rh+6}" fill="rgba(123,196,127,.08)"/><text x="${sx(BENCH.cpl_brl[1])}" y="${H-5}" text-anchor="middle" font-size="10.5" fill="#7BC47F">faixa R$ ${BENCH.cpl_brl[0]}–${BENCH.cpl_brl[1]}</text>`;
  const bars=rows.map((r,i)=>{ const y=T+i*rh, c=r.cpl==null?'#3a3a3a':(r.cpl>BENCH.cpl_brl[1]?'#E5533D':(r.status==='Escalar'?'#7BC47F':'#F26A1B')), w=r.cpl==null?0:sx(r.cpl)-L;
    return `<text x="${L-8}" y="${y+rh/2+4}" text-anchor="end" font-size="12" fill="#F3EDE4">${r.id}</text><rect x="${L}" y="${y+7}" width="${w}" height="${rh-14}" rx="2" fill="${c}"/><text x="${L+w+8}" y="${y+rh/2+4}" font-size="11.5" fill="#B9B3A8">${r.cpl==null?'—':fmtBRL(r.cpl)} · ${fmtPct(r.ctr)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CPL por criativo">${band}${bars}</svg><div class="legend"><span><i style="background:#7BC47F"></i>escalar</span><span><i style="background:#F26A1B"></i>manter</span><span><i style="background:#E5533D"></i>acima da faixa</span></div>`;
}

function stepsHtml(){
  const s=[["Estrategista","plano","on"],["Criativo","2 por conjunto","on"],["Designer","direção de arte","on"],["Compliance","score 0–100","on"],["Aprovação","humana","gate"],["Publicador","em pausa · Meta","on"],["Ativar","humano · Ads Manager","gate"],["Dados","export → painel","on"]];
  return `<div class="steps">${s.map(x=>`<div class="step ${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;

function campTable(list, compact){

  return `<table>
    <thead><tr><th>Campanha</th><th class="hm">Via</th><th class="hm">Orçamento</th><th class="n">Criativos</th><th class="n">Score</th><th>Status</th></tr></thead>
    <tbody>${list.map(c=>{ const st=campStatus(c); return `<tr class="row" onclick="location.hash='#/campanhas/${c.id}'">
      <td class="wide">${esc(c.nome)}<span class="sub">${esc(c.data)}${compact?'':' · '+esc(c.periodo)}</span></td>
      <td class="m hm">${esc(c.via)}</td><td class="n hm">${esc(c.orcamento)}</td>
      <td class="n">${c.criativos.length}</td>
      <td class="n"><span class="bar"><i style="--w:${c.score}%;--c:${col(scls(c.score))}"></i><b>${c.score}</b></span></td>
      <td><span class="tag ${st[0]}">${st[1]}</span></td></tr>`; }).join('')}</tbody></table>`;
}

      </div></div>
    ${campTable(list,false)}

};
V.campanha = (q, id, tab) => {

  if(tab==='resumo') body = `<div class="kv"><div><b>Objetivo</b>${esc(c.objetivo)}</div><div><b>Público</b>${esc(c.publico)}</div><div><b>Orçamento</b>${esc(c.orcamento)}</div><div><b>Período</b>${esc(c.periodo)}</div></div>
    <div class="kv" style="margin-top:12px"><div><b>Montada via</b>${esc(c.via)}</div><div><b>Tempo da cadeia</b>${esc(c.tempo)}</div><div><b>Veredito do compliance</b>${esc(c.veredito)} · ${c.score}/100</div><div><b>Status</b>${esc(c.status)}</div></div>
    ${(c.historico&&c.historico.length)?`<h3 style="margin:16px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)">Histórico</h3><table>${c.historico.map(h=>{const e=ETAPAS.find(x=>x[0]===h.etapa)||ETAPAS[0]; return `<tr><td style="width:120px"><span class="tag ${e[2]}">${e[1]}</span></td><td class="m">${esc((h.em||'').replace('T',' '))}</td><td>${esc(h.por||'')}</td></tr>`;}).join('')}</table>`:''}
    ${c.publicacao?`<div class="kv" style="margin-top:12px"><div><b>Meta · campanha</b>${esc(c.publicacao.meta_campaign_id||'')}</div><div><b>Status no Meta</b>${esc(c.publicacao.status||'')}</div><div><b>Publicado em</b>${esc(c.publicacao.publicado_em||'')}</div><div><b>Anúncios</b>${(c.publicacao.ad_ids||[]).length}</div></div>`:''}

V.criativos = (q) => {
  const f=(q.q||'').toLowerCase(), camp=q.camp||'', v=q.v||'', sort=q.sort||'score', dir=q.dir||'desc';

  list.sort((a,b)=>{ let A=a[sort], B=b[sort]; if(sort==='score'){A=a.score??-1;B=b.score??-1;} if(typeof A==='string'){A=A.toLowerCase();B=(B||'').toLowerCase();} return (A>B?1:A<B?-1:0)*(dir==='asc'?1:-1); });
  const th=(k,l,cls='')=>`<th class="s ${cls} ${sort===k?dir:''}" onclick="setQ('sort','${k}');setQ('dir','${sort===k&&dir==='desc'?'asc':'desc'}')">${l}</th>`;
  return `<div class="card">
    <div class="hd"><h2>${list.length} criativo${list.length===1?'':'s'}</h2>
      <div class="r filters">
        <select class="sel" onchange="setQ('camp',this.value)"><option value="">Todas as campanhas</option>${CAMPANHAS.map(c=>`<option value="${c.id}" ${camp===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>

  </div>`;
};
function resultsBody(camp, allowSim){
  let r = camp && camp.resultados;
  if(SIM && (!camp || SIM.camp.id===camp.id)){ camp = SIM.camp; r = SIM.res; }
  if(!r) return `<div class="empty"><b>Sem resultados ainda</b>Quando a campanha rodar, o export do Meta Ads vai para o agente Dados, que grava o bloco <code>resultados</code> em <code>dados/campanhas.json</code>.${allowSim?`<br><button class="btn ghost sm" onclick="loadSim()">Ver com dados simulados</button>`:''}</div>`;
  const t=r.totais||{}, ctr=ctrOf(t), cpl=cplOf(t), frq=frqOf(t);
  const J={ctr:judge('ctr',ctr), cpl:judge('cpl',cpl), frq:judge('frq',frq)};
  const rank=(r.criativos||[]).map(c=>({...c, cpl:cplOf(c), ctr:ctrOf(c), frq:frqOf(c)})).sort((a,b)=>(a.cpl??1e9)-(b.cpl??1e9));
  const hl = id => (camp.criativos.find(x=>x.id===id)||{}).hl || '';
  const a = r.analise;
  return `
  <div class="hd" style="margin-top:4px"><div class="r">${r.simulado?`<span class="tag amb">simulação · não são dados reais</span>`:`<span class="tag ok">${esc(r.fonte||'Meta Ads')}</span>`}<span class="chip">${fmtDia(r.periodo.inicio)}–${fmtDia(r.periodo.fim)}</span><span class="chip">analisado ${esc(r.analisado_em)}</span></div>${SIM?`<button class="btn ghost sm" onclick="SIM=null;render()">Fechar simulação</button>`:''}</div>

    <div class="tile"><b>${fmtBRL(t.gasto)}</b><span>gasto</span><em>${camp.orcamento?`de ${esc(camp.orcamento)}`:''}</em></div>
    <div class="tile"><b>${fmtN(t.leads)}</b><span>leads</span><em>${t.conversoes!=null?`${fmtN(t.conversoes)} conversões`:''}</em></div>
    <div class="tile"><b>${fmtPct(ctr)}</b><span>CTR</span><em class="${J.ctr[0]}">${J.ctr[1]}</em></div>
    <div class="tile"><b>${fmtBRL(cpl)}</b><span>CPL</span><em class="${J.cpl[0]}">${J.cpl[1]}</em></div>
    <div class="tile"><b>${fmt1(frq)}</b><span>frequência</span><em class="${J.frq[0]}">${J.frq[1]}</em></div>
  </div>
  <div class="cols">

    <div class="chart"><h3>CPL por criativo</h3>${rank.length?svgCreatives(r.criativos):'<p class="m">Sem dados por criativo.</p>'}</div>
  </div>
  ${rank.length?`<table style="margin-top:16px"><thead><tr><th>#</th><th>Headline</th><th class="n">Gasto</th><th class="n">CTR</th><th class="n">CPL</th><th class="n">Freq.</th><th>Ação</th></tr></thead>
    <tbody>${rank.map(c=>`<tr><td class="id">${c.id}</td><td>${esc(hl(c.id))}<span class="sub">${esc(c.conj||'')}</span></td><td class="n">${fmtBRL(c.gasto)}</td><td class="n">${fmtPct(c.ctr)}</td><td class="n">${fmtBRL(c.cpl)}</td><td class="n">${fmt1(c.frq)}</td><td><span class="tag ${c.status||''}">${esc(c.status||'—')}</span></td></tr>`).join('')}</tbody></table>`:''}
  ${a?`<div class="read" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
    <p>${esc(a.resumo||'')}</p>

  </div>`:''}`;
}

V.agentes = () => `<div class="agents">${AGENTES.map(a=>`<div class="agent row" onclick="location.hash='#/agentes/${a.skill}'"><div class="g">${a.k}</div><h3>${esc(a.nome)}</h3><p>${esc(a.papel)}</p><div class="meta"><span><i class="dot ${a.st==='ok'?'':a.st}" style="margin-right:7px"></i>${esc(a.stl)}</span><code>${esc(a.skill)}</code></div></div>`).join('')}</div>

/* ---- editor de agente (SKILL.md → commit no GitHub via api/skill.php) ---- */
const GH_RAW = 'https://raw.githubusercontent.com/iaeautomacao-lgtm/agente-trafego-hermes/main/skills/trafego-pago/';
const GH_WEB = 'https://github.com/iaeautomacao-lgtm/agente-trafego-hermes';
let ED = { skill:null, original:'', loading:false };
V.agente = (q, skill) => {
  const a = AGENTES.find(x=>x.skill===skill); if(!a) return `<div class="empty"><b>Agente não encontrado</b><a href="#/agentes">Voltar</a></div>`;
  if(ED.skill!==skill){ ED={skill, original:'', loading:true}; loadSkill(skill); }
  return `<div class="crumb"><a href="#/agentes">Agentes</a> / ${esc(a.nome)}</div>
  <div class="ed">
    <div class="card">
      <div class="hd"><div><h2>${esc(a.nome)}</h2><span class="sub" style="color:var(--mute);font-size:12.5px"><code>skills/trafego-pago/${esc(skill)}/SKILL.md</code></span></div>
        <div class="r"><span class="chip" id="edstat"><i class="dot off"></i>carregando…</span><button class="btn ghost sm" onclick="reloadSkill()">Recarregar</button><button class="btn sm" id="edsave" onclick="openSave()" disabled>Salvar</button></div></div>
      <textarea id="edta" spellcheck="false" oninput="edChanged()" placeholder="carregando SKILL.md…"></textarea>
    </div>
    <div>
      <div class="card"><div class="hd"><h2>Agente</h2></div>
        <table class="meta">
          <tr><td>Papel</td><td>${esc(a.papel)}</td></tr>
          <tr><td>Status</td><td><i class="dot ${a.st==='ok'?'':a.st}" style="margin-right:7px"></i>${esc(a.stl)}</td></tr>
          <tr><td>Runtime</td><td>${esc(a.runtime)}</td></tr>
          <tr><td>Histórico</td><td><a href="${GH_WEB}/commits/main/skills/trafego-pago/${esc(skill)}/SKILL.md" target="_blank" rel="noopener" style="color:var(--orange)">commits desta skill ↗</a></td></tr>
        </table>
      </div>
      <div class="card"><div class="hd"><h2>O que acontece ao salvar</h2></div>
        <table class="meta">
          <tr><td class="id">1</td><td>Commit no GitHub com seu nome (histórico completo, dá para voltar)</td></tr>
          <tr><td class="id">2</td><td>Este painel já mostra a versão nova (lê direto do GitHub)</td></tr>
          <tr><td class="id">3</td><td>Paperclip / Hermes pegam a versão nova no próximo <em>Check for updates</em> · <code>install.sh</code></td></tr>
        </table>
      </div>
      <div class="card"><div class="hd"><h2>Regras da SKILL.md</h2></div>
        <table class="meta">
          <tr><td>Topo</td><td>Começa com <code>---</code> / <code>name: ${esc(skill)}</code> / <code>description:</code> / <code>---</code></td></tr>
          <tr><td>Conteúdo</td><td>Markdown: papel, input, output obrigatório, regras invioláveis</td></tr>
          <tr><td>Não mexer</td><td>No <code>name</code>. Mudar o nome quebra a cadeia do Orquestrador.</td></tr>
        </table>
      </div>
    </div>
  </div>`;
};
async function loadSkill(skill){
  let txt=null;
  try{ const r=await fetch(GH_RAW+skill+'/SKILL.md?t='+Date.now(),{cache:'no-store'}); if(r.ok) txt=await r.text(); }catch(e){}
  if(txt==null){ try{ const r=await fetch('skills/trafego-pago/'+skill+'/SKILL.md?t='+Date.now(),{cache:'no-store'}); if(r.ok) txt=await r.text(); }catch(e){} }
  if(ED.skill!==skill || !$('#edta')) return;
  const ta=$('#edta'), st=$('#edstat');
  if(txt==null){ st.innerHTML='<i class="dot red"></i>não consegui carregar'; return; }
  ED.original=txt; ED.loading=false; ta.value=txt; st.innerHTML='<i class="dot"></i>versão do GitHub · '+txt.split('\n').length+' linhas'; $('#edsave').disabled=true;
}
function reloadSkill(){ if($('#edta').value!==ED.original && !confirm('Descartar as alterações não salvas?')) return; ED.original=''; loadSkill(ED.skill); }
function edChanged(){ const ch=$('#edta').value!==ED.original; $('#edsave').disabled=!ch; $('#edstat').innerHTML=ch?'<i class="dot warn"></i>alterado · não salvo':'<i class="dot"></i>sem alterações'; }
const GH_API = 'https://api.github.com/repos/iaeautomacao-lgtm/agente-trafego-hermes/contents/skills/trafego-pago/';
const b64utf8 = str => btoa(unescape(encodeURIComponent(str)));
const getTok = () => sessionStorage.getItem('ddm_gh_token') || localStorage.getItem('ddm_gh_token') || '';
function openSave(){
  const content=$('#edta').value, skill=ED.skill;
  if(!new RegExp('^---\\s*\\nname:\\s*'+skill.replace(/-/g,'\\-')+'\\s*\\n').test(content)){ toast('A SKILL.md precisa começar com "---" e "name: '+skill+'".', true); return; }
  const author=localStorage.getItem('ddm_author')||'', tok=getTok();
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box"><h2>Salvar ${esc(skill)}</h2><p>Vira um commit no GitHub com seu nome.</p>
    <label>Seu nome</label><input id="sv-author" value="${esc(author)}" placeholder="Gisele">
    <label>Token do GitHub ${tok?'<span style="color:var(--ok)">· salvo neste navegador</span>':''}</label><input id="sv-tok" type="password" autocomplete="off" placeholder="${tok?'(usar o token salvo)':'github_pat_… ou ghp_…'}">
    <p style="margin-top:6px">Fine-grained token em <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--orange)">github.com/settings/personal-access-tokens</a> → repositório <code>agente-trafego-hermes</code> → Contents: Read and write. Fica só no seu navegador.</p>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="sv-keep" style="width:auto" ${localStorage.getItem('ddm_gh_token')?'checked':''}> lembrar o token neste navegador</label>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" type="button" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn" type="button" id="sv-go">Salvar e publicar</button></div></div>`;
  document.body.appendChild(m); (tok?$('#sv-author'):$('#sv-tok')).focus();
  $('#sv-go').onclick=async()=>{ const btn=$('#sv-go'); btn.disabled=true; btn.textContent='Salvando…';
    const author=$('#sv-author').value.trim()||'painel', token=$('#sv-tok').value.trim()||getTok();
    if(!token){ toast('Falta o token do GitHub.', true); btn.disabled=false; btn.textContent='Salvar e publicar'; return; }
    localStorage.setItem('ddm_author',author);
    if($('#sv-keep').checked){ localStorage.setItem('ddm_gh_token',token); sessionStorage.removeItem('ddm_gh_token'); } else { localStorage.removeItem('ddm_gh_token'); sessionStorage.setItem('ddm_gh_token',token); }
    const H={ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
    const url=GH_API+skill+'/SKILL.md';
    try{
      const r1=await fetch(url+'?ref=main',{headers:H}); const cur=await r1.json().catch(()=>({}));
      if(!r1.ok||!cur.sha){ throw new Error(r1.status===401?'token inválido':(r1.status===404?'token sem acesso ao repositório':(cur.message||r1.status))); }
      const body={ message:'Agente '+skill+': editado por '+author+' via painel', content:b64utf8(content), sha:cur.sha, branch:'main' };
      const r2=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)}); const j=await r2.json().catch(()=>({}));
      if(!r2.ok){ throw new Error(j.message||('GitHub '+r2.status)); }
      m.remove(); ED.original=content; edChanged();
      toast(`Salvo. Commit <a href="${esc(j.commit.html_url)}" target="_blank" rel="noopener">${j.commit.sha.slice(0,7)}</a> · o Paperclip pega no próximo <em>Check for updates</em>`);
    }catch(e){ toast('Não salvou: '+e.message, true); btn.disabled=false; btn.textContent='Salvar e publicar'; }
  };
}
function toast(html, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.innerHTML=html; document.body.appendChild(t); setTimeout(()=>t.remove(), err?7000:9000); }
function checkEditing(){ const el=$('#edstate'); if(el) el.innerHTML=getTok()?'<i class="dot"></i>edição habilitada · token salvo':'<i class="dot warn"></i>edição: precisa de um token do GitHub (pedido ao salvar)'; }
V.nova = () => `<div class="two">
  <div class="card"><div class="hd"><h2>Briefing</h2></div>
    <form id="brief" onsubmit="return false">
      <label for="obj">Objetivo</label><input id="obj" placeholder="aluno com matrícula trancada agenda conversa com a instituição">

/* ---------------- router ---------------- */
const TITLES = {home:'Visão geral', campanhas:'Campanhas', campanha:'Campanha', criativos:'Criativos', resultados:'Resultados', agentes:'Agentes', agente:'Agente', nova:'Nova campanha'};
function parse(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const seg=path.split('/').filter(Boolean); const q={}; new URLSearchParams(qs||'').forEach((v,k)=>q[k]=v); return {seg,q}; }
function setQ(k,v){ const {seg,q}=parse(); if(v) q[k]=v; else delete q[k]; const qs=new URLSearchParams(q).toString(); location.hash='#/'+seg.join('/')+(qs?'?'+qs:''); }
function render(){
  const {seg,q}=parse(); let name=seg[0]||'home', html='';
  if(name==='campanhas' && seg[1]){ name='campanha'; html=V.campanha(q,seg[1],seg[2]); }
  else if(name==='agentes' && seg[1]){ name='agente'; html=V.agente(q,seg[1]); }
  else if(V[name]) html=V[name](q); else { name='home'; html=V.home(q); }
  $('#title').textContent = TITLES[name];
  $('#view').innerHTML = html;
  $('#topr').innerHTML = (name==='campanhas'||name==='criativos') ? `<input class="search" placeholder="Buscar…" value="${esc(q.q||'')}" oninput="clearTimeout(window._t);window._t=setTimeout(()=>setQ('q',this.value),250)">` : `<span class="chip"><i class="dot"></i>Paperclip local</span><span class="chip hm"><i class="dot warn"></i>Meta Ads não conectado</span>`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#/'+(name==='campanha'?'campanhas':name==='agente'?'agentes':name==='home'?'':name)));
  if(name==='agentes') checkEditing();
  if(name!=='agente') ED={skill:null,original:'',loading:false};
  $('[data-n=camp]').textContent=CAMPANHAS.length; $('[data-n=cri]').textContent=allCreatives().length; $('[data-n=ag]').textContent=AGENTES.length;
  $('#side').classList.remove('open');
  if(name==='campanhas'||name==='criativos'){ const s=$('.search'); if(s && document.activeElement!==s && q.q){ } }
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', render);
$('#burger').addEventListener('click', ()=>$('#side').classList.toggle('open'));

async function loadSim(){
  let res=null; try{ const r=await fetch('dados/exemplo-simulado.json',{cache:'no-store'}); if(r.ok) res=await r.json(); }catch(e){}
  if(!res){ alert('Abra o painel pelo servidor (https) para carregar o exemplo.'); return; }
  SIM={camp:CAMPANHAS[0], res}; render();
}
function genBrief(){
  const g=id=>document.getElementById(id).value;
  const t=`Briefing para a cadeia completa (siga a skill ddm-orquestrador-trafego):
Objetivo: ${g('obj')||'—'}
Público: ${g('pub')||'—'}
Orçamento: ${g('orc')||'—'}
Período: ${g('per')||'—'}
Restrições: ${g('res')||'nenhuma além das regras padrão'}
Entrega esperada: plano → criativos → direção de arte → parecer de compliance com score → documento final no issue com AGUARDANDO APROVAÇÃO HUMANA e request_confirmation para o board. Não publicar nada.
Depois que a campanha rodar: o export do Meta Ads vai para o agente Dados de Campanhas, que atualiza dados/campanhas.json e devolve as hipóteses para o próximo ciclo.`;
  $('#out').textContent=t; $('#out').classList.add('show'); $('#copy').style.display='inline-flex';
}
async function copyBrief(){ try{ await navigator.clipboard.writeText($('#out').textContent); $('#copy').textContent='Copiado'; setTimeout(()=>$('#copy').textContent='Copiar',1500);}catch(e){} }

async function boot(){
  try{ const r=await fetch('dados/campanhas.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(Array.isArray(j.campanhas)&&j.campanhas.length){ CAMPANHAS=j.campanhas; BENCH=Object.assign({},BENCH_FALLBACK,j.benchmarks||{}); META=j; } } }catch(e){}
  if(META.atualizado_em){ const [y,m,d]=META.atualizado_em.split('-'); $('#upd').textContent=`${+d} ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]} ${y}`; } else $('#upd').textContent='6 out 2026';
  render();
}
boot();
</script>
