<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tráfego Pago · Grupo DDM</title>
<meta name="description" content="Painel interno do Grupo DDM: campanhas sempre ligadas no Meta, público trocado todo dia a partir do CRM, criativos, links com rastreio e resultados no DDMP.">
<script>
  // tema antes de pintar a página (evita piscar). Padrão: claro.
  (function(){ var t='light'; try{ t=localStorage.getItem('ddm_tema')||'light'; }catch(e){} document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light'); })();
</script>
<link rel="icon" type="image/png" href="assets/ddm-marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="light"]{
    --bg:#F5F5F7; --side:#FFFFFF; --panel:#FFFFFF; --panel-2:#F6F6F8; --hover:#F1F1F4;
    --line:rgba(17,17,20,.08); --line-2:rgba(17,17,20,.16);
    --ink:#111114; --ink-2:#45464D; --mute:#8A8B93;
    --orange:#E8470A; --on-orange:#FFFFFF; --amber:#B26B00; --ok:#1E8E3E; --red:#D93025;
    --orange-soft:rgba(255,83,4,.10); --ok-soft:rgba(30,142,62,.10); --amber-soft:rgba(178,107,0,.11); --red-soft:rgba(217,48,37,.09);
    --chip-bg:rgba(17,17,20,.05); --track:rgba(17,17,20,.08); --shadow:0 12px 32px rgba(17,17,20,.12); --backdrop:rgba(17,17,20,.35);
    --chart-bar:rgba(255,83,4,.28); --chart-line:#111114;
    --grad:linear-gradient(180deg,#FF4500 0%,#FF6108 100%); --card-shadow:0 1px 2px rgba(17,17,20,.04);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#0D0D0F; --side:#131316; --panel:#17171B; --panel-2:#1E1E23; --hover:#24242A;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --ink:#F5F5F7; --ink-2:#B5B6BD; --mute:#7C7D85;
    --orange:#FF6A1F; --on-orange:#FFFFFF; --amber:#E8A33D; --ok:#5CC27A; --red:#F0604D;
    --orange-soft:rgba(255,90,10,.15); --ok-soft:rgba(92,194,122,.13); --amber-soft:rgba(232,163,61,.13); --red-soft:rgba(240,96,77,.13);
    --chip-bg:rgba(255,255,255,.06); --track:rgba(255,255,255,.09); --shadow:0 12px 32px rgba(0,0,0,.5); --backdrop:rgba(0,0,0,.6);
    --chart-bar:rgba(255,90,10,.38); --chart-line:#F5F5F7;
    --grad:linear-gradient(180deg,#FF4500 0%,#FF6108 100%); --card-shadow:none;
    color-scheme: dark;
  }
  :root{ --serif:"Montserrat","Inter",system-ui,sans-serif; --sans:"Inter",system-ui,-apple-system,sans-serif; --sidew:232px; --r:12px; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .15s,color .15s}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink-2)}

  /* layout */
  .app{display:grid;grid-template-columns:var(--sidew) 1fr;min-height:100vh}
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{padding:4px 8px 20px}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .logo span{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.02em;color:var(--ink)}
  .brand .logo img{width:38px;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(255,69,0,.25))}
  .brand small{display:block;margin-top:8px;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13.5px}
  .nav a:hover{background:var(--hover);color:var(--ink)}
  .nav a.on{background:var(--orange-soft);color:var(--orange);font-weight:600}
  .nav a.on::before{background:var(--orange)}
  .nav a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
  .nav a .n{margin-left:auto;font-size:11.5px;color:var(--mute);background:var(--chip-bg);padding:1px 7px;border-radius:999px}
  .nav a .n.hot{color:var(--on-orange);background:var(--orange)}
  .nav .sep{height:1px;background:var(--line);margin:8px 6px}
  .side .foot{margin-top:auto;padding:12px 8px 0;font-size:11.5px;color:var(--mute);line-height:1.6}
  .side .foot a{color:var(--ink-2)}
  .main{min-width:0;padding:0 28px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .top h1{margin:0;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em}
  .top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .search{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px;color:var(--ink);width:220px;font:13.5px var(--sans)}
  .search:focus{border-color:var(--orange);outline:0}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;background:var(--panel)}
  .chip.sim{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .dot.warn{background:var(--amber)}.dot.off{background:var(--mute)}.dot.red{background:var(--red)}.dot.o{background:var(--orange)}
  .theme{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--panel)}
  .theme button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--ink-2)}
  .theme button.on{background:var(--panel-2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .theme svg{width:13px;height:13px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;background:var(--grad);color:var(--on-orange);border-radius:9px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(255,69,0,.25)}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);font-weight:600;box-shadow:none}
  .btn.ghost:hover{color:var(--ink);border-color:var(--ink-2)}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.xs{padding:3px 8px;font-size:11.5px;font-weight:600}

  /* cards / tiles */
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--card-shadow)}
  .tile b{display:block;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
  .tile b.o{color:var(--orange)}
  .tile span{display:block;font-size:12px;color:var(--mute);margin-top:7px}
  .tile em{display:block;font-style:normal;font-size:11.5px;margin-top:3px;color:var(--ink-2)}
  .tile em.ok{color:var(--ok)}.tile em.amb{color:var(--amber)}.tile em.red{color:var(--red)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--card-shadow)}
  .card + .card{margin-top:18px}
  .card h2{margin:0;font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.005em}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .card .hd .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card .sub2{color:var(--mute);font-size:12.5px}
  .two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
  .two > .card, .cols > .card{margin:0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .mb{margin-bottom:18px}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 18px;margin-bottom:18px;color:var(--ink-2);font-size:13.5px}
  .banner b{color:var(--ink)}
  .banner.sim{border:1px solid var(--amber);background:var(--amber-soft)}

  /* tables */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.03em;text-transform:uppercase;padding:0 12px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
  th.s{cursor:pointer;user-select:none}
  th.s:hover{color:var(--ink-2)}
  th.s.asc::after{content:" ↑"}th.s.desc::after{content:" ↓"}
  td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--hover)}
  td.m{color:var(--mute);white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.n{text-align:right}
  td .sub{display:block;color:var(--mute);font-size:12px}
  td.wide{min-width:220px}
  td.id{color:var(--mute);font-variant-numeric:tabular-nums;width:46px}
  td.best{color:var(--ok);font-weight:700}
  td.worst{color:var(--red);font-weight:700}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--chip-bg);white-space:nowrap}
  .tag.ok{color:var(--ok);background:var(--ok-soft)}.tag.amb{color:var(--amber);background:var(--amber-soft)}.tag.red{color:var(--red);background:var(--red-soft)}.tag.o{color:var(--orange);background:var(--orange-soft)}
  .bar{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
  .bar i{display:block;width:80px;height:4px;background:var(--track);border-radius:2px;position:relative;overflow:hidden}
  .bar i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
  .bar b{font-weight:600;min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:30px 18px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:9px}
  .empty b{display:block;margin-bottom:4px;color:var(--ink)}
  .empty .btn{margin-top:12px}
  .link{display:flex;align-items:center;gap:8px;min-width:0}
  .link code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:620px;min-width:0;display:inline-block;font-size:12px}
  .link code b{color:var(--orange);font-weight:600}

  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .sel{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;font:13px var(--sans)}
  .sel:focus{border-color:var(--orange);outline:0}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
  .seg button{padding:6px 11px;font-size:12.5px;color:var(--ink-2)}
  .seg button.on{background:var(--panel-2);color:var(--ink)}

  /* detail */
  .crumb{font-size:12.5px;color:var(--mute);margin-bottom:6px}
  .crumb a{color:var(--ink-2)}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kv div{background:var(--panel-2);border-radius:8px;padding:12px 14px;font-size:13px}
  .kv b{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
  .tabs a{padding:8px 12px;color:var(--ink-2);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs a.on{color:var(--ink);border-color:var(--orange)}
  .steps{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .step{background:var(--panel-2);border-radius:10px;padding:10px 12px;border-left:2px solid var(--mute)}
  .step.on{border-left-color:var(--orange)}.step.gate{border-left-color:var(--ok)}.step.soon{border-left-color:var(--amber)}
  .step small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
  .step b{display:block;font-size:12.5px;font-weight:600}
  .step span{font-size:11.5px;color:var(--mute)}

  /* OK do dia */
  .oklist{list-style:none;margin:0;padding:0}
  .oklist li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .oklist li:last-child{border-bottom:0}
  .oklist .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
  .oklist .ic.feito{background:var(--ok-soft);color:var(--ok)}
  .oklist .ic.aguardando{background:var(--orange-soft);color:var(--orange)}
  .oklist .ic.info{background:var(--chip-bg);color:var(--ink-2)}
  .oklist .t{flex:1}
  .oklist .k{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;display:block}
  .clock{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em}

  /* charts */
  .chart h3{margin:0 0 8px;font-size:13px;font-weight:600}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart .tx{fill:var(--mute);font-size:10.5px}
  .chart .tx2{fill:var(--ink-2);font-size:11.5px}
  .chart .lb{fill:var(--ink);font-size:12px}
  .chart .gl{stroke:var(--line)}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .read p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
  .read ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
  .read li{margin:3px 0}
  .read h3{margin:0 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
  .read .next{margin-top:12px;padding:11px 13px;border-left:2px solid var(--orange);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13.5px}

  /* agents */
  .agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .agent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
  .agent .g{width:34px;height:34px;border-radius:10px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;margin-bottom:10px}
  .agent h3{margin:0;font-size:14px;font-weight:600}
  .agent h3 .tag{margin-left:6px;vertical-align:1px}
  .agent p{margin:4px 0 10px;font-size:12.5px;color:var(--mute);flex:1}
  .agent .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
  .agent .meta code{font-size:11px}
  .agent.row{cursor:pointer}
  .agent.row:hover{border-color:var(--line-2);background:var(--panel-2)}

  /* form */
  label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
  input,textarea,select.in{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 11px;font:13.5px/1.45 var(--sans)}
  input:focus,textarea:focus{border-color:var(--orange);outline:0}
  textarea{min-height:64px;resize:vertical}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .out{display:none;margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;color:var(--ink-2)}
  .out.show{display:block}

  /* editor */
  .ed{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  .ed > div > .card + .card{margin-top:18px}
  .ed textarea{min-height:560px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2;white-space:pre;overflow:auto}
  .ed .meta td{padding:8px 10px 8px 0;font-size:13px}
  .ed .meta td:first-child{color:var(--mute);white-space:nowrap;width:110px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:8px;padding:12px 16px;font-size:13px;max-width:420px;z-index:30;box-shadow:var(--shadow)}
  .toast.err{border-left-color:var(--red)}
  .toast a{color:var(--orange)}
  .modal{position:fixed;inset:0;background:var(--backdrop);display:grid;place-items:center;z-index:40}
  .modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:20px 22px;width:min(420px,92vw)}
  .modal h2{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:18px}
  .modal p{margin:0 0 6px;font-size:12.5px;color:var(--mute)}
  .hide{display:none!important}
  @media (max-width:1180px){.steps{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.agents{grid-template-columns:1fr 1fr}.ed{grid-template-columns:1fr}}
  @media (max-width:760px){
    :root{--sidew:0px}
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:20;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none}
    .main{padding:0 16px 40px}
    .burger{display:inline-flex}
    .top{flex-wrap:wrap}
    .tiles{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.frow{grid-template-columns:1fr}.agents{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}
    .search{width:140px}
    .bar i{width:46px}
    .hm{display:none}
    .theme button span{display:none}
    .link code{max-width:calc(100vw - 170px)}
  }
  .burger{display:none;width:34px;height:34px;border:1px solid var(--line-2);border-radius:7px;align-items:center;justify-content:center;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><span>GRUPO</span><img src="assets/ddm-marca.png" alt="DDM"></div><small>Tráfego Pago · interno</small></div>
    <nav class="nav" id="nav">
      <a href="#/">Visão geral</a>
      <a href="#/ok">OK do dia<span class="n" data-n="ok"></span></a>
      <div class="sep"></div>
      <a href="#/campanhas">Campanhas<span class="n" data-n="camp"></span></a>
      <a href="#/criativos">Criativos<span class="n" data-n="cri"></span></a>
      <a href="#/publicos">Públicos<span class="n" data-n="pub"></span></a>
      <a href="#/resultados">Resultados</a>
      <div class="sep"></div>
      <a href="#/agentes">Agentes<span class="n" data-n="ag"></span></a>
      <a href="#/nova">Novo tema / cliente</a>
    </nav>
    <div class="foot">Dados: <code>dados/campanhas.json</code><br>Atualizado <span id="upd">—</span><br><a href="https://github.com/iaeautomacao-lgtm/agente-trafego-hermes">Repositório</a> · <a href="http://127.0.0.1:3100/GRU/">Paperclip</a></div>
  </aside>
  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px"><button class="burger" id="burger" aria-label="Menu">≡</button><h1 id="title">Visão geral</h1></div>
      <div class="r"><span id="topr" style="display:contents"></span>
        <div class="theme" role="group" aria-label="Tema">
          <button type="button" data-t="light" onclick="setTheme('light')" title="Tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Claro</span></button>
          <button type="button" data-t="dark" onclick="setTheme('dark')" title="Tema escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Escuro</span></button>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
/* ---------------- tema ---------------- */
function setTheme(t){ document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('ddm_tema', t); }catch(e){} markTheme(); }
function markTheme(){ const t=document.documentElement.getAttribute('data-theme'); document.querySelectorAll('.theme button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); }

/* ---------------- dados ---------------- */
const VAZIO = { versao:2, clientes:[], pilotos:[], ok_diario:{horario:'09:00',pendente:null,historico:[]}, utm:{destino:'https://ddmp.com.br/',parametros:{cliente:'cliente',campanha:'campanha',criativo:'criativo'},fixos:{utm_source:'meta',utm_medium:'paid_social'}}, benchmarks:{custo_visita_brl:[1,2.5],frequencia_max:3,gasto_minimo_para_decidir_brl:50} };
const AGENTES = [
  { k:"O", nome:"Orquestrador Hermes", papel:"Roda o ciclo todo dia antes do horário do OK e junta tudo num único pedido de OK", skill:"ddm-orquestrador-trafego", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"1", nome:"Público CRM", novo:true, papel:"Pega a base do CRM (quem está em aberto) e troca o público do cliente no Meta, todo dia", skill:"ddm-audiencia-crm", st:"warn", stl:"base só na produção + token Meta", runtime:"Paperclip · Hermes" },
  { k:"2", nome:"Planejador de campanhas", papel:"Tema por cliente e época (Natal, Black Friday) e quando renovar criativos", skill:"ddm-estrategista-trafego", paperclip:"Estrategista de Tráfego 2", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"3", nome:"Criativo (imagens)", papel:"Conceito visual e imagens feed/stories com o Gemini", skill:"ddm-designer-anuncios", paperclip:"Designer de Anúncios", st:"ok", stl:"Gemini ativo", runtime:"Paperclip · Hermes" },
  { k:"4", nome:"Copy", papel:"Texto de cada criativo + link para o DDMP com rastreio", skill:"ddm-criativo-anuncios", paperclip:"Criativo de Anúncios 2", st:"ok", stl:"ativo", runtime:"Paperclip · Hermes" },
  { k:"5", nome:"Compliance", papel:"Meta, LGPD e tom de cobrança; score 0–100 + segunda opinião do Jev", skill:"ddm-compliance-anuncios", paperclip:"Compliance de Anúncios 2", st:"ok", stl:"Jev ativo", runtime:"Paperclip · Hermes" },
  { k:"6", nome:"Publicador Meta", papel:"Sobe anúncios novos na campanha ligada (sempre em pausa) e pausa os fracos", skill:"ddm-publicador-meta", st:"warn", stl:"falta token Meta", runtime:"Paperclip · Hermes" },
  { k:"7", nome:"Resultados DDMP", novo:true, papel:"Visitas e acordos no DDMP por cliente / campanha / criativo (UTM)", skill:"ddm-resultados-ddmp", st:"warn", stl:"falta export do DDMP", runtime:"Paperclip · Hermes" },
  { k:"8", nome:"Análise de campanhas", papel:"Custo por visita e por acordo de cada criativo → escalar, manter ou pausar", skill:"ddm-dados-campanhas", paperclip:"Dados de Campanhas 2", st:"ok", stl:"esperando dados", runtime:"Paperclip · Hermes" },
];
const PENDENCIAS = [
  ["Token do Meta (usuário do sistema) + ids do público e do conjunto","Gui · Gustavo","warn"],
  ["Base legal do público registrada","Gustavo","warn"],
  ["Export do DDMP: visitas e acordos por UTM","Jair","warn"],
  ["Base do CRM (quem está em aberto): só na ida para produção","Jair / TI","off"],
  ["Decidir a linguagem dos criativos atuais (Compliance × o que já rodou)","Gui · Gustavo","warn"],
];
let REAL = VAZIO, DATA = VAZIO, SIM = false;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = (n,d=0) => n==null||isNaN(n) ? '—' : 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtN = n => n==null ? '—' : n.toLocaleString('pt-BR');
const fmtK = n => n==null ? '—' : (n>=10000 ? (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : n.toLocaleString('pt-BR'));
const fmtPct = n => n==null ? '—' : n.toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%';
const fmtDia = d => { if(!d) return '—'; const [y,m,dd] = d.slice(0,10).split('-'); return `${+dd}/${+m}`; };
const fmtQuando = d => { if(!d) return '—'; const t=d.split('T'); return fmtDia(t[0]) + (t[1]?' · '+t[1].slice(0,5):''); };
const vcls = v => v==="aprovado" ? "ok" : (v==="reprovado" ? "red" : "amb");
const scls = s => s<=20 ? "ok" : (s<=50 ? "amb" : "red");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const stCls = s => ({ligado:'ok',ligada:'ok','aguardando OK':'o',pausado:'red',pausada:'red','em pausa':'amb'}[s]||'');
const sugCls = s => ({Escalar:'ok',Manter:'',Pausar:'red'}[s]||'');

const camps = () => (DATA.clientes||[]).flatMap(cl => (cl.campanhas||[]).map(c => ({...c, cliente:cl})));
const metricsOf = (camp, id) => ((camp.resultados&&camp.resultados.criativos)||[]).find(x=>x.id===id) || {};
const allCreatives = () => camps().flatMap(c => (c.criativos||[]).map(x => ({...x, camp:c, m:metricsOf(c,x.id)})));
const totals = () => { const t={gasto:0,visitas_ddmp:0,acordos:0,has:false}; camps().forEach(c=>{ const r=c.resultados&&c.resultados.totais; if(r){ t.has=true; t.gasto+=r.gasto||0; t.visitas_ddmp+=r.visitas_ddmp||0; t.acordos+=r.acordos||0; } }); return t; };
const okPend = () => { const p=DATA.ok_diario&&DATA.ok_diario.pendente; return p ? (p.itens||[]).filter(i=>i.status==='aguardando').length : 0; };
function linkHtml(u){ if(!u) return '<span class="m">—</span>'; const p=DATA.utm.parametros; let s=esc(u); Object.values(p).forEach(k=>{ s=s.replace(new RegExp('('+k+'=)([^&]*)'),'$1<b>$2</b>'); }); return `<span class="link"><code title="${esc(u)}">${s}</code><button class="btn ghost xs" onclick="copyTxt(this,'${esc(u)}')">copiar</button></span>`; }
async function copyTxt(btn, t){ try{ await navigator.clipboard.writeText(t); btn.textContent='copiado'; setTimeout(()=>btn.textContent='copiar',1400); }catch(e){ toast('Não consegui copiar: '+esc(t), true); } }
function simBanner(){
  if(SIM) return `<div class="banner sim"><span><b>Simulação.</b> Números inventados, na ordem de grandeza da campanha mostrada na reunião de 20/10. Nada disso é real.</span><button class="btn ghost sm" onclick="exitSim()">Sair da simulação</button></div>`;
  if(!(REAL.clientes||[]).length) return `<div class="banner"><span><b>Ainda sem dados reais.</b> Os números aparecem quando o Meta, o export do CRM e o do DDMP estiverem ligados.</span><button class="btn ghost sm" onclick="loadSim()">Ver com dados simulados</button></div>`;
  return '';
}

/* ---------------- gráficos (cores do tema) ---------------- */
function svgCusto(crs){
  const rows = crs.map(c=>({id:c.id, v:c.m.custo_visita, a:c.m.custo_acordo, ac:c.m.acordos, sug:c.m.sugestao})).filter(r=>r.v!=null).sort((x,y)=>x.v-y.v);
  if(!rows.length) return '<p class="m">Sem custo por visita ainda.</p>';
  const W=480, rh=30, T=4, H=T+rows.length*rh+24, L=34, R=150, iw=W-L-R;
  const bench=DATA.benchmarks.custo_visita_brl||[1,2.5];
  const mx=Math.max(bench[1]*1.15, ...rows.map(r=>r.v))*1.05, sx=v=>L+iw*v/mx;
  const band=`<rect x="${sx(bench[0])}" y="${T-2}" width="${sx(bench[1])-sx(bench[0])}" height="${rows.length*rh+4}" style="fill:var(--ok-soft)"/><text class="tx" x="${sx(bench[1])}" y="${H-6}" text-anchor="middle" style="fill:var(--ok)">faixa ${fmtBRL(bench[0],0)}–${bench[1].toLocaleString('pt-BR')}</text>`;
  const fill = s => s==='Pausar'?'var(--red)':(s==='Escalar'?'var(--ok)':'var(--orange)');
  const bars=rows.map((r,i)=>{ const y=T+i*rh, w=sx(r.v)-L;
    return `<text class="lb" x="${L-8}" y="${y+rh/2+4}" text-anchor="end">${esc(r.id)}</text><rect x="${L}" y="${y+8}" width="${w}" height="${rh-16}" rx="2" style="fill:${fill(r.sug)}"/><text class="tx2" x="${L+w+8}" y="${y+rh/2+4}">${fmtBRL(r.v,2)}/visita${r.a!=null?' · '+fmtBRL(r.a,0)+'/acordo':''}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Custo por visita no DDMP, por criativo">${band}${bars}</svg><div class="legend"><span><i style="background:var(--ok)"></i>escalar</span><span><i style="background:var(--orange)"></i>manter</span><span><i style="background:var(--red)"></i>pausar</span></div>`;
}
function svgDiario(d){
  if(!d||!d.length) return '<p class="m">Sem série diária.</p>';
  const W=640,H=200,L=44,R=36,T=12,B=28, iw=W-L-R, ih=H-T-B, n=d.length;
  const mg=Math.max(...d.map(x=>x.gasto||0))*1.15||1, mv=Math.max(...d.map(x=>x.visitas_ddmp||0))*1.15||1;
  const bw=Math.max(6, iw/n*0.56), x=i=>L+iw*(i+0.5)/n;
  const bars=d.map((r,i)=>`<rect x="${x(i)-bw/2}" y="${T+ih-((r.gasto||0)/mg)*ih}" width="${bw}" height="${((r.gasto||0)/mg)*ih}" rx="2" style="fill:var(--chart-bar)"/>`).join('');
  const pts=d.map((r,i)=>`${x(i)},${T+ih-((r.visitas_ddmp||0)/mv)*ih}`).join(' ');
  const dots=d.map((r,i)=>`<circle cx="${x(i)}" cy="${T+ih-((r.visitas_ddmp||0)/mv)*ih}" r="3" style="fill:var(--chart-line)"/>`).join('');
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${T+ih-f*ih}" y2="${T+ih-f*ih}"/>`).join('');
  const yl=[0,.5,1].map(f=>`<text class="tx" x="${L-8}" y="${T+ih-f*ih+4}" text-anchor="end">${Math.round(f*mg/1.15)}</text>`).join('');
  const yr=[0,.5,1].map(f=>`<text class="tx" x="${W-R+8}" y="${T+ih-f*ih+4}">${Math.round(f*mv/1.15)}</text>`).join('');
  const step=Math.ceil(n/7);
  const xl=d.map((r,i)=> i%step===0||i===n-1 ? `<text class="tx" x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDia(r.dia)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto e visitas ao DDMP por dia">${grid}${bars}<polyline points="${pts}" fill="none" style="stroke:var(--chart-line)" stroke-width="1.6"/>${dots}${yl}${yr}${xl}</svg>
  <div class="legend"><span><i style="background:var(--chart-bar)"></i>gasto R$ (esq.)</span><span><i style="background:var(--chart-line)"></i>visitas ao DDMP (dir.)</span></div>`;
}
function svgPublico(h){
  if(!h||h.length<2) return '<p class="m">O histórico aparece depois de algumas trocas.</p>';
  const W=420,H=120,L=8,R=8,T=8,B=22, iw=W-L-R, ih=H-T-B, n=h.length;
  const vals=h.map(x=>x.pessoas), mn=Math.min(...vals)*0.995, mx=Math.max(...vals)*1.002;
  const x=i=>L+iw*(i+0.5)/n, y=v=>T+ih-(v-mn)/(mx-mn||1)*ih, bw=Math.max(4,iw/n*0.6);
  const bars=h.map((r,i)=>`<rect x="${x(i)-bw/2}" y="${y(r.pessoas)}" width="${bw}" height="${T+ih-y(r.pessoas)}" rx="2" style="fill:var(--chart-bar)"><title>${fmtDia(r.data)}: ${fmtN(r.pessoas)} pessoas · −${fmtN(r.sairam)} / +${fmtN(r.entraram)}</title></rect>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tamanho do público por dia">${bars}<text class="tx" x="${x(0)}" y="${H-6}" text-anchor="middle">${fmtDia(h[0].data)}</text><text class="tx" x="${x(n-1)}" y="${H-6}" text-anchor="middle">${fmtDia(h[n-1].data)}</text></svg>`;
}

/* ---------------- telas ---------------- */
const V = {};
function stepsHtml(){
  const s=[["todo dia","Público CRM","troca o público","on"],["todo dia","Resultados DDMP","visitas e acordos","on"],["todo dia","Análise","custo por criativo","on"],["quando precisa","Planejador","tema / renovar","soon"],["quando precisa","Criativo + Copy","imagem e texto","soon"],["quando precisa","Compliance","score + Jev","soon"],[DATA.ok_diario.horario||'09:00',"OK do dia","1 pessoa, 1 vez","gate"],["depois do OK","Publicador","em pausa → ligar","on"]];
  return `<div class="steps">${s.map(x=>`<div class="step ${x[3]}"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>`;
}
function okCard(full){
  const o=DATA.ok_diario||{}, p=o.pendente;
  const ic = s => s==='feito'?'✓':(s==='aguardando'?'?':'i');
  const lista = p ? `<ul class="oklist">${(p.itens||[]).map(i=>`<li><span class="ic ${esc(i.status)}">${ic(i.status)}</span><span class="t"><span class="k">${esc(({publico:'Público',criativos:'Criativos novos',pausar:'Pausar',escalar:'Verba',resultados:'Resultados',alerta:'Alerta'})[i.tipo]||i.tipo)}</span>${esc(i.texto)}</span>${i.status==='aguardando'?'<span class="tag o">aguardando</span>':(i.status==='feito'?'<span class="tag ok">feito</span>':'')}</li>`).join('')}</ul>`
    : `<div class="empty"><b>Nada para aprovar agora</b>O Orquestrador monta o pedido de OK antes das ${esc(o.horario||'09:00')}: público trocado, números de ontem, criativos novos e o que pausar.</div>`;
  return `<div class="card ${full?'':'mb'}"><div class="hd"><div><h2>OK do dia</h2><span class="sub2">${p?`${fmtDia(p.data)} · ${esc(p.issue||'')}`:`todo dia às ${esc(o.horario||'09:00')} (horário de Brasília)`}</span></div>
    <div class="r">${p&&okPend()?`<span class="tag o">${okPend()} aguardando</span>`:''}<a class="btn sm" href="http://127.0.0.1:3100/GRU/" target="_blank" rel="noopener">Dar o OK no Paperclip</a>${full?'':'<a class="btn ghost sm" href="#/ok">Detalhes</a>'}</div></div>${lista}</div>`;
}
V.home = () => {
  const cs=camps(), lig=cs.filter(c=>c.status==='ligada').length, t=totals(), crs=allCreatives();
  const cv = t.has&&t.visitas_ddmp ? t.gasto/t.visitas_ddmp : null, ca = t.has&&t.acordos ? t.gasto/t.acordos : null;
  const bench=DATA.benchmarks.custo_visita_brl||[1,2.5], vb=DATA.verba||{};
  const pub=(DATA.clientes||[]).reduce((a,c)=>a+((c.publico&&c.publico.pessoas)||0),0);
  return `${simBanner()}
  <div class="tiles">
    <div class="tile"><b>${lig}</b><span>campanhas ligadas</span><em>${cs.length} no total · ${crs.filter(c=>c.status==='ligado').length} criativos rodando</em></div>
    <div class="tile"><b>${pub?fmtK(pub):'—'}</b><span>pessoas nos públicos</span><em>${(DATA.clientes||[]).length} cliente(s)</em></div>
    <div class="tile"><b>${t.has?fmtBRL(t.gasto):'—'}</b><span>gasto no período</span><em class="${vb.total_max_brl&&t.gasto>=0.8*vb.total_max_brl?'red':''}">${vb.total_max_brl?`de ${fmtBRL(vb.total_max_brl)} · até ${fmtBRL(vb.diaria_max_brl)}/dia`:(t.has?fmtN(t.visitas_ddmp)+' visitas ao DDMP':'sem dados')}</em></div>
    <div class="tile"><b class="o">${fmtBRL(cv,2)}</b><span>custo por visita</span><em class="${cv==null?'':(cv>bench[1]?'red':'ok')}">${cv==null?'sem dados':(cv>bench[1]?'acima da faixa':'dentro da faixa')}</em></div>
    <div class="tile"><b>${t.has?fmtN(t.acordos):'—'}</b><span>acordos rastreados</span><em>${ca!=null?fmtBRL(ca,2)+' por acordo':'só os fechados no DDMP'}</em></div>
  </div>
  ${okCard(false)}
  <div class="card mb"><div class="hd"><h2>Ciclo diário</h2><span class="chip"><i class="dot"></i>${AGENTES.length} agentes · 1 OK humano por dia</span></div>${stepsHtml()}</div>
  <div class="two">
    <div class="card"><div class="hd"><h2>Clientes</h2><a class="btn ghost sm" href="#/campanhas">Ver campanhas</a></div>${clientesTable()}</div>
    <div class="card"><div class="hd"><h2>Pendências</h2></div>
      <table>${PENDENCIAS.map(p=>`<tr><td><i class="dot ${p[2]==='off'?'off':p[2]}" style="margin-right:9px"></i>${esc(p[0])}<span class="sub" style="padding-left:16px">${esc(p[1])}</span></td></tr>`).join('')}</table></div>
  </div>`;
};
function clientesTable(){
  const cl=DATA.clientes||[];
  if(!cl.length) return `<div class="empty"><b>Nenhum cliente cadastrado</b>O primeiro entra quando o Gustavo liberar o Meta e o export do CRM. <a href="#/nova" style="color:var(--orange)">Como cadastrar</a></div>`;
  return `<div class="tw"><table><thead><tr><th>Cliente</th><th class="n">Público</th><th class="hm">Última troca</th><th>Campanha</th><th class="n">R$/visita</th><th class="n">Acordos</th></tr></thead><tbody>${cl.flatMap(c=>(c.campanhas||[]).map(k=>{ const t=(k.resultados&&k.resultados.totais)||{}; return `<tr class="row" onclick="location.hash='#/campanhas/${esc(c.id)}/${esc(k.id)}'"><td>${esc(c.nome)}</td><td class="n">${fmtK(c.publico&&c.publico.pessoas)}</td><td class="m hm">${fmtQuando(c.publico&&c.publico.ultima_sync)}</td><td>${esc(k.nome)}<span class="sub">tema: ${esc(k.tema||'—')}</span></td><td class="n">${fmtBRL(t.custo_visita,2)}</td><td class="n">${fmtN(t.acordos)}</td></tr>`; })).join('')}</tbody></table></div>`;
}
V.ok = () => {
  const h=(DATA.ok_diario&&DATA.ok_diario.historico)||[];
  return `${simBanner()}<div class="two"><div>${okCard(true)}</div>
    <div class="card"><div class="hd"><h2>Como funciona</h2></div>
      <table class="meta">
        <tr><td class="id">1</td><td>Antes das ${esc(DATA.ok_diario.horario||'09:00')}, o Orquestrador roda Público CRM → Resultados DDMP → Análise (e, se precisar, Planejador → Criativo → Copy → Compliance)</td></tr>
        <tr><td class="id">2</td><td>Ele abre <b>um</b> pedido de OK no Paperclip com tudo: público trocado, números de ontem, criativos novos, o que pausar</td></tr>
        <tr><td class="id">3</td><td>Uma pessoa lê e dá o OK (ou recusa item a item)</td></tr>
        <tr><td class="id">4</td><td>O Publicador sobe os criativos aprovados <b>em pausa</b> e pausa os fracos</td></tr>
        <tr><td class="id">5</td><td>A pessoa liga os anúncios novos no Ads Manager (o Meta costuma exigir isso)</td></tr>
      </table>
      <h3 style="margin:16px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)">OKs anteriores</h3>
      ${h.length?`<table>${h.map(x=>`<tr><td>${fmtDia(x.data)}</td><td class="m">${esc(x.por)} · ${fmtQuando(x.em)}</td><td class="n">${fmtN(x.itens)} itens</td></tr>`).join('')}</table>`:'<p class="m" style="margin:0">Nenhum ainda.</p>'}
    </div></div>`;
};
V.campanhas = (q) => {
  const f=(q.q||'').toLowerCase();
  const list=camps().filter(c=>!f||(c.nome+c.cliente.nome+(c.tema||'')).toLowerCase().includes(f));
  const pil=DATA.pilotos||[];
  return `${simBanner()}<div class="card"><div class="hd"><h2>${list.length} campanha${list.length===1?'':'s'} sempre ligada${list.length===1?'':'s'}</h2><a class="btn sm" href="#/nova">+ Novo tema / cliente</a></div>

  if(txt==null){ try{ const r=await fetch('skills/trafego-pago/'+skill+'/SKILL.md?t='+Date.now(),{cache:'no-store'}); if(r.ok) txt=await r.text(); }catch(e){} }
  if(ED.skill!==skill || !$('#edta')) return;
  const ta=$('#edta'), st=$('#edstat');
  if(txt==null){ st.innerHTML='<i class="dot red"></i>não consegui carregar'; return; }
  ED.original=txt; ED.loading=false; ta.value=txt; st.innerHTML='<i class="dot"></i>versão do GitHub · '+txt.split('\n').length+' linhas'; $('#edsave').disabled=true;

const GH_API = 'https://api.github.com/repos/iaeautomacao-lgtm/agente-trafego-hermes/contents/skills/trafego-pago/';
const b64utf8 = str => btoa(unescape(encodeURIComponent(str)));
const store = { get(k,s){ try{ return (s?sessionStorage:localStorage).getItem(k)||''; }catch(e){ return ''; } }, set(k,v,s){ try{ (s?sessionStorage:localStorage).setItem(k,v); }catch(e){} }, del(k,s){ try{ (s?sessionStorage:localStorage).removeItem(k); }catch(e){} } };
const getTok = () => store.get('ddm_gh_token',true) || store.get('ddm_gh_token');

    <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="sv-keep" style="width:auto" ${store.get('ddm_gh_token')?'checked':''}> lembrar o token neste navegador</label>

      if(!r1.ok||!cur.sha){ throw new Error(r1.status===401?'token inválido':(r1.status===404?'token sem acesso ao repositório':(cur.message||r1.status))); }
      const body={ message:'Agente '+skill+': editado por '+author+' via painel', content:b64utf8(content), sha:cur.sha, branch:'main' };
      const r2=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)}); const j=await r2.json().catch(()=>({}));
      if(!r2.ok){ throw new Error(j.message||('GitHub '+r2.status)); }
      m.remove(); ED.original=content; edChanged();
      toast(`Salvo. Commit <a href="${esc(j.commit.html_url)}" target="_blank" rel="noopener">${j.commit.sha.slice(0,7)}</a> · o Paperclip pega no próximo <em>Check for updates</em>`);
    }catch(e){ toast('Não salvou: '+esc(e.message), true); btn.disabled=false; btn.textContent='Salvar e publicar'; }
  };
}
function toast(html, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.innerHTML=html; document.body.appendChild(t); setTimeout(()=>t.remove(), err?7000:9000); }
function checkEditing(){ const el=$('#edstate'); if(el) el.innerHTML=getTok()?'<i class="dot"></i>edição habilitada · token salvo':'<i class="dot warn"></i>edição: precisa de um token do GitHub (pedido ao salvar)'; }

function genPedido(){
  const g=id=>document.getElementById(id).value.trim();
  const t=`Pedido para o Orquestrador (siga a skill ddm-orquestrador-trafego, modo "tema novo / cliente novo"):

Observações: ${g('f-obs')||'—'}
Entrega: Planejador → Criativo (imagens) → Copy (com link utm.py) → Compliance. Os criativos aprovados entram no próximo OK do dia; nada é publicado antes do OK.`;
  $('#out').textContent=t; $('#out').classList.add('show'); $('#copy').style.display='inline-flex';

async function copyPedido(){ try{ await navigator.clipboard.writeText($('#out').textContent); $('#copy').textContent='Copiado'; setTimeout(()=>$('#copy').textContent='Copiar',1500);}catch(e){} }

/* ---------------- rotas ---------------- */
const TITLES = {home:'Visão geral', ok:'OK do dia', campanhas:'Campanhas', campanha:'Campanha', criativos:'Criativos', publicos:'Públicos', resultados:'Resultados', agentes:'Agentes', agente:'Agente', nova:'Novo tema / cliente'};
function parse(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const seg=path.split('/').filter(Boolean).map(decodeURIComponent); const q={}; new URLSearchParams(qs||'').forEach((v,k)=>q[k]=v); return {seg,q}; }
function setQ(k,v){ const {seg,q}=parse(); if(v) q[k]=v; else delete q[k]; const qs=new URLSearchParams(q).toString(); location.hash='#/'+seg.join('/')+(qs?'?'+qs:''); }
function render(){
  const {seg,q}=parse(); let name=seg[0]||'home', html='';
  if(name==='campanhas' && seg[1]){ name='campanha'; html=V.campanha(q,seg[1],seg[2],seg[3]); }
  else if(name==='agentes' && seg[1]){ name='agente'; html=V.agente(q,seg[1]); }
  else if(V[name]) html=V[name](q); else { name='home'; html=V.home(q); }
  $('#title').textContent = TITLES[name];
  $('#view').innerHTML = html;
  const busca = (name==='campanhas'||name==='criativos') ? `<input class="search" placeholder="Buscar…" value="${esc(q.q||'')}" oninput="clearTimeout(window._t);window._t=setTimeout(()=>setQ('q',this.value),250)">` : '';
  $('#topr').innerHTML = busca + (SIM?'<span class="chip sim hm">simulação</span>':'') + (busca?'':`<span class="chip hm"><i class="dot"></i>Paperclip local</span><span class="chip hm"><i class="dot warn"></i>Meta não conectado</span>`);
  const navKey = name==='campanha'?'campanhas':(name==='agente'?'agentes':(name==='home'?'':name));
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#/'+navKey));
  if(name==='agentes') checkEditing();
  if(name!=='agente') ED={skill:null,original:'',loading:false};
  const n=okPend(), okEl=$('[data-n=ok]'); okEl.textContent=n||''; okEl.classList.toggle('hot',!!n); okEl.style.display=n?'':'none';
  $('[data-n=camp]').textContent=camps().length; $('[data-n=cri]').textContent=allCreatives().length; $('[data-n=pub]').textContent=(DATA.clientes||[]).length; $('[data-n=ag]').textContent=AGENTES.length;
  $('#side').classList.remove('open');
  markTheme();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', render);
$('#burger').addEventListener('click', ()=>$('#side').classList.toggle('open'));

async function loadSim(){
  let s=null; try{ const r=await fetch('dados/exemplo-simulado.json',{cache:'no-store'}); if(r.ok) s=await r.json(); }catch(e){}
  if(!s){ toast('Abra o painel pelo servidor (https) para carregar o exemplo.', true); return; }
  DATA=Object.assign({},VAZIO,s); DATA.benchmarks=Object.assign({},VAZIO.benchmarks,s.benchmarks||{}); DATA.ok_diario=Object.assign({},VAZIO.ok_diario,s.ok_diario||{}); SIM=true; render();
}
function exitSim(){ DATA=REAL; SIM=false; render(); }
function setUpd(){ if(REAL.atualizado_em){ const [y,m,d]=REAL.atualizado_em.split('-'); $('#upd').textContent=`${+d} ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]} ${y}`; } }
async function boot(){
  try{ const r=await fetch('dados/campanhas.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(j.versao>=2){ REAL=Object.assign({},VAZIO,j); REAL.benchmarks=Object.assign({},VAZIO.benchmarks,j.benchmarks||{}); REAL.ok_diario=Object.assign({},VAZIO.ok_diario,j.ok_diario||{}); REAL.utm=Object.assign({},VAZIO.utm,j.utm||{}); } } }catch(e){}
  DATA=REAL; setUpd(); render();
  if(/[?&]sim=1/.test(location.search)) loadSim();
}
boot();
